name: Release

# Publishes a GitHub release (with the install zip) whenever package.json's
# version has no release yet. Bump the version, add release-notes/v<version>.md
# and push to main - the release and its tag are created automatically.
on:
  push:
    branches: [main]
    paths:
      - package.json
      - release-notes/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists - nothing to do."
            exit 0
          fi
          mkdir -p pkg/decky-demo-finder
          cp -r dist main.py plugin.json package.json LICENSE README.md pkg/decky-demo-finder/
          (cd pkg && zip -qr "../decky-demo-finder-${VERSION}.zip" decky-demo-finder)
          gh release create "$VERSION" "decky-demo-finder-${VERSION}.zip" \
            --target "$GITHUB_SHA" \
            --title "${VERSION}" \
            --notes-file "release-notes/${VERSION}.md"
